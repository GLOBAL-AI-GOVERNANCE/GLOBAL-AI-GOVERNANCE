name: Profile Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 0"

permissions:
  contents: read

jobs:
  profile-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check reachable history privacy
        run: python3 -B tools/check_history_privacy.py

      - name: Validate public profile
        run: |
          python3 -B tools/validate_profile.py

      - name: Verify estate truth
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/verify_estate_truth.py

      - name: Check suite path navigation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/check_suite_path.py
      - name: Check suite versions match GitHub releases
        # Always on PR/push/schedule/dispatch so version-pin PRs cannot skip the gate.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/sync_suite_versions.py --check

      - name: Validate Assurance Delta
        run: python3 -B -m unittest tests/test_assurance_delta.py -v

      - name: Check schema identifiers
        run: python3 -B tools/check_schema_ids.py

      - name: Check schema identifiers resolve live
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 -B tools/check_schema_ids.py --online

      - name: Validate portfolio integration contracts
        run: |
          python3 -B tools/validate_integration.py

      - name: Validate program closeout
        run: |
          python3 -B tools/validate_closeout.py
      - name: Validate final internal reference
        run: |
          python3 -B tools/validate_final_internal_reference.py
