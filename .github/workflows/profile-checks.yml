name: Profile Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate public profile
        run: |
          python3 -B tools/validate_profile.py

      - name: Validate portfolio integration contracts
        run: |
          python3 -B tools/validate_integration.py

      - name: Validate program closeout
        run: |
          python3 -B tools/validate_closeout.py
