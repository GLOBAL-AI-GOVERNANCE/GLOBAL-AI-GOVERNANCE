name: Sync suite versions

on:
  schedule:
    # Hourly: pick up new product releases without cross-repo secrets.
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [suite-release]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-suite-versions
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Regenerate pins from GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/sync_suite_versions.py
      - name: Detect changes
        id: diff
        run: |
          # Meaningful drift only. Ignore suite-manifest generated_at-only churn
          # so hourly runs do not open timestamp-only pull requests.
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import subprocess
          import sys
          from pathlib import Path

          files = [
              "portfolio.json",
              "journey.json",
              "contracts/program-closeout.json",
              "README.md",
          ]
          meaningful = False
          for path in files:
              result = subprocess.run(
                  ["git", "diff", "--quiet", "--", path], check=False
              )
              if result.returncode != 0:
                  meaningful = True
                  break

          manifest = Path("suite-manifest.json")
          if subprocess.run(
              ["git", "diff", "--quiet", "--", str(manifest)], check=False
          ).returncode != 0:
              try:
                  old = json.loads(
                      subprocess.check_output(
                          ["git", "show", "HEAD:suite-manifest.json"], text=True
                      )
                  )
              except Exception:
                  old = {}
              new = json.loads(manifest.read_text(encoding="utf-8"))
              old.pop("generated_at", None)
              new.pop("generated_at", None)
              if old != new:
                  meaningful = True
              else:
                  subprocess.run(
                      ["git", "checkout", "--", str(manifest)], check=True
                  )

          if meaningful:
              print("changed=true")
              sys.stdout.flush()
              # Keep diagnostics off GITHUB_OUTPUT (stdout is redirected there).
              subprocess.run(
                  ["git", "status", "-sb"], check=False, stdout=sys.stderr
              )
              subprocess.run(
                  ["git", "diff", "--stat"], check=False, stdout=sys.stderr
              )
          else:
              print("changed=false")
              print("No version drift against GitHub releases.", file=sys.stderr)
          PY
      - name: Open or refresh sync pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="automation/suite-versions-$(date -u +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add portfolio.json journey.json suite-manifest.json \
            contracts/program-closeout.json README.md
          git commit -m "$(cat <<'MSG'
          Sync suite versions from GitHub releases

          Regenerated by tools/sync_suite_versions.py. Source of truth is each
          repository's newest published release tag.
          MSG
          )"
          git push -u origin HEAD
          PR_URL="$(gh pr create --title "Sync suite versions from GitHub releases" --body "$(cat <<'BODY'
          ## Summary
          Automated regeneration of `portfolio.json`, `journey.json`, `suite-manifest.json`, closeout published-release pins, and the README install/portfolio version blocks from each product's newest GitHub release.

          ## Test plan
          - [ ] profile-checks green
          - [ ] auto-merge squash when required checks pass
          BODY
          )")"
          echo "Opened $PR_URL"
          gh pr merge --auto --squash "$PR_URL" || true
