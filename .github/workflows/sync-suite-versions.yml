name: Sync suite versions

on:
  schedule:
    # Hourly: pick up new product releases without cross-repo secrets.
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [suite-release]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-suite-versions
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Regenerate pins from GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/sync_suite_versions.py
      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- portfolio.json journey.json suite-manifest.json \
              contracts/program-closeout.json README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No version drift against GitHub releases."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status -sb
            git diff --stat
          fi
      - name: Open or refresh sync pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="automation/suite-versions-$(date -u +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add portfolio.json journey.json suite-manifest.json \
            contracts/program-closeout.json README.md
          git commit -m "$(cat <<'MSG'
          Sync suite versions from GitHub releases

          Regenerated by tools/sync_suite_versions.py. Source of truth is each
          repository's newest published release tag.
          MSG
          )"
          git push -u origin HEAD
          PR_URL="$(gh pr create --title "Sync suite versions from GitHub releases" --body "$(cat <<'BODY'
          ## Summary
          Automated regeneration of `portfolio.json`, `journey.json`, `suite-manifest.json`, closeout published-release pins, and the README install/portfolio version blocks from each product's newest GitHub release.

          ## Test plan
          - [ ] profile-checks green
          - [ ] auto-merge squash when required checks pass
          BODY
          )")"
          echo "Opened $PR_URL"
          gh pr merge --auto --squash "$PR_URL" || true
